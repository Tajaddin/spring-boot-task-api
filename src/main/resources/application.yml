spring:
  application:
    name: spring-boot-task-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/taskapi}
    username: ${DATABASE_USER:taskapi}
    password: ${DATABASE_PASSWORD:taskapi}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

app:
  jwt:
    # Base64-encoded 256-bit secret. Required: startup fails if APP_JWT_SECRET
    # is unset. Only the demo profile ships a (public) dev value.
    secret: ${APP_JWT_SECRET}
    # Token lifetime in minutes.
    ttl-minutes: ${APP_JWT_TTL_MINUTES:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
