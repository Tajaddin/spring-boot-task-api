spring:
  datasource:
    # H2 in PostgreSQL-compatibility mode so the same Flyway migrations run.
    url: jdbc:h2:mem:taskapi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    # Use the H2-compatible migration set under db/migration so types line up.
    locations: classpath:db/migration

app:
  jwt:
    secret: dGhpcy1pcy1hLXRlc3Qtb25seS1zZWNyZXQta2V5LWZvci1qdW5pdC10ZXN0aW5n
    ttl-minutes: 60
