services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskapi
      POSTGRES_USER: taskapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, e.g. openssl rand -hex 24}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapi"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/taskapi
      DATABASE_USER: taskapi
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, e.g. openssl rand -hex 24}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET to a base64 256-bit key, e.g. openssl rand -base64 32}
    ports:
      - "8080:8080"
